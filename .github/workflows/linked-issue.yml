---
name: Linked issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The body comes through env, never inline, so a pull request cannot inject shell.
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +(#[0-9]+|https://github\.com/[^ ]+/issues/[0-9]+)'; then
            exit 0
          fi
          if printf '%s' "$BODY" | grep -qE '^Side change: +[^ ]'; then
            exit 0
          fi
          echo "::error::The pull request links no issue: write 'Closes #<n>', or 'Side change: <why>' for a change no issue holds."
          exit 1
