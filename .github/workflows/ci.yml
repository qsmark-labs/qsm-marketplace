---
name: CI

on:
  push:
    branches-ignore: [badges]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4
      # The root `prepare` script (.gates/plugin-deps.ts) builds the Python venv with uv and fails
      # loud without it, so uv is on PATH before the root install.
      - name: Install uv
        run: |
          pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      # A plugin owns its npm dependencies (plugins/<name>/package.json); typecheck and the tests
      # resolve them from the plugin's own node_modules, as the install base does.
      - name: Install each plugin's dependencies
        shell: bash
        run: |
          for manifest in plugins/*/package.json; do
            (cd "$(dirname "$manifest")" && bun install --frozen-lockfile)
          done
      # The tests drive these real binaries and fail loud without them (no skip hides a broken
      # pipeline): wt, gitleaks (the pre-push secrets gate blocks without it), rumdl and
      # markdownlint-cli2 for qsm-langdev's markdown fixers, oxlint (with oxlint-tsgolint for its
      # type-aware rules) and oxfmt for its TypeScript gate and fixers,
      # yamllint, taplo, semgrep, lizard and jscpd because the pre-commit gate marks a checker whose
      # tool is absent `worse` and blocks the commit (init writes yaml and toml, a.ts is code),
      # fish (with fish_indent), shfmt and shellmetrics for qsm-langdev's fish and shell checkers the
      # gate tests run, imagemagick 7 for the `magick` of qsm-uix (apt ships 6, which has no
      # `magick`), openvpn for the key material of qsm-secrets' capture corpus, and the upstream
      # openspec CLI for qsm-openspec doctor.
      - name: Install the tools the tests run
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install worktrunk gitleaks rumdl markdownlint-cli2 imagemagick yamllint taplo openvpn fish shfmt
          pipx install semgrep
          pipx install lizard
          bun add -g @fission-ai/openspec
          bun add -g oxlint@1.88.0 oxlint-tsgolint@7.0.2004 oxfmt@0.73.0 jscpd@5.3.2 knip@6.38.0 dependency-cruiser@18.4.0
          uv tool install ruff==0.17.3
          uv tool install vulture==2.16
          uv tool install pyright==1.1.414
          uv tool install bandit==1.9.4
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          # openvpn installs into sbin.
          echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # shellmetrics ships nowhere packaged: one script, pinned to upstream's last commit.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/shellspec/shellmetrics/b3bfff2af6880443112cdbf2ea449440b30ab9b0/shellmetrics -o "$HOME/.local/bin/shellmetrics"
          chmod +x "$HOME/.local/bin/shellmetrics"
      # One run names every checker binary the tests drive that the runner lacks, so a missing tool
      # is not found one failed test at a time. doctor reads the registry; a scratch repository
      # enables the languages the suite exercises (docs and multi are always on).
      - name: Every checker binary is on PATH
        shell: bash
        run: |
          probe="$(mktemp -d)"
          git init -q "$probe"
          mkdir "$probe/.qsm-langdev"
          echo '{"languages":["ts","py","shell","fish","rust"]}' > "$probe/.qsm-langdev/gates.json"
          report="$(bun plugins/qsm-langdev/scripts/cli.ts doctor "$probe" --json || true)"
          rm -rf "$probe"
          missing="$(jq -r '.data.checks[] | select(.present | not) | "  \(.binary) (checker \(.check)): \(.install)"' <<<"$report")"
          if [ -n "$missing" ]; then
            echo "checker binaries missing from PATH:" >&2
            echo "$missing" >&2
            exit 1
          fi
      # qsm-statusline doctor is `missing` unless the compiled bin is on PATH (AGENTS.md, Iron Law 9).
      - name: Compile the qsm-statusline bin onto PATH
        run: |
          mkdir -p "$HOME/qsm-bin"
          bun build --compile --target bun --outfile "$HOME/qsm-bin/qsm-statusline" plugins/qsm-statusline/scripts/cli.ts
          echo "$HOME/qsm-bin" >> "$GITHUB_PATH"
      - run: bun run validate
      # oxlint's type-aware rules read the hooks modules' types from the same engine declarations,
      # so in CI every hooks file resolves to `error` and trips the unsafe-* rules. CI lints the
      # rest and formats everything; the local pre-commit and pre-push gates lint the hooks with
      # the declarations present.
      - name: Lint
        run: |
          bunx oxlint --deny-warnings --ignore-pattern "plugins/*/hooks/**"
          bunx oxfmt --check ".gates/**/*.ts" "lib/**/*.ts" "plugins/**/*.{ts,tsx}"
      # `bun run typecheck` also typechecks the hooks modules, which needs the engine
      # declarations that only a local Claude Code session writes. CI runs the root part.
      - run: bun check
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          bun test ./ ./.gates 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish badges
        # Force-pushes one commit to the badges branch; shields.io reads it from there.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test.log"
          out="$RUNNER_TEMP/badges"; mkdir -p "$out"
          badge() { printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$2" "$3" "$4" > "$out/$1.json"; }
          pass=$(grep -Eo '^ *[0-9]+ pass' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
          fail=$(grep -Eo '^ *[0-9]+ fail' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
          # No summary at all means the suite never ran: that is red, not green.
          color=brightgreen; if [ "$fail" != 0 ] || [ "$pass" = 0 ]; then color=red; fi
          badge tests tests "$pass passed, $fail failed" "$color"
          badge plugins plugins "$(jq '.plugins | length' .claude-plugin/marketplace.json)" blue
          cd "$out"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "badges for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
