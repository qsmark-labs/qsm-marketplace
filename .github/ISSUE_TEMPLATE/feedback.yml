---
name: Feedback
description: How an agent or a tool of the marketplace behaved, and how it should behave.
assignees: [Questi0nM4rk]
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: >-
        Keep it abstract: no home path, login, hostname, email or secret. Say how it should
        behave, not how to fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: "`marketplace` or the plugin's name."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The steps that led to it, in the abstract.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
