<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The desktop slot's system bus (slot-desktop gives the address): the fake machine owns the
     system daemons' names on it, and everyone in the slot may talk to everyone. -->
<busconfig>
  <type>system</type>
  <!-- Replaced by the address slot-desktop passes; dbus-daemon refuses a config without one. -->
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
  </policy>
</busconfig>
